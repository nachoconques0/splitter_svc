server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nothing here sets an Access-Control-Allow-* header, and nothing needs to.
    # The page and the API answer on this one origin, so the browser never makes
    # a cross-origin request and there is no preflight to permit.
    #
    # Matching /api and /api/... but not /apifoo, so a page route that merely
    # starts with those letters still reaches the SPA.
    location ~ ^/api(/.*)?$ {
        # Docker's embedded DNS, resolved per request rather than once at startup.
        # Without the variable nginx resolves "api" when it boots and refuses to
        # start if the API is not up, so a crashed API would take the page down
        # with it instead of showing an error on it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        # rewrite, not a capture interpolated into proxy_pass: $1 holds the
        # *decoded* path, and putting it back unescaped turns /api/people/John%20Doe
        # into a 400. rewrite preserves the escaping. The Go service therefore owns
        # the paths the spec names (/health, /bills/...) and is not made to know
        # what prefix it is mounted under.
        rewrite ^/api/(.*)$ /$1 break;
        rewrite ^/api$      /   break;

        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
